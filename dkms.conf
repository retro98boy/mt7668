PACKAGE_NAME="mt7668"
PACKAGE_VERSION="#MODULE_VERSION#"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_KERNEL="^(5[.]1[5-9]|6[.]([0-9]|1[0-9])|7[.][0-3])([.-]|$)"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"

BUILT_MODULE_NAME[0]="wlan_mt76x8_sdio"
BUILT_MODULE_LOCATION[0]="MT7668-WiFi/drv_wlan/MT6632/wlan"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="bt_mt7668"
BUILT_MODULE_LOCATION[1]="MT7668-Bluetooth"
DEST_MODULE_LOCATION[1]="/updates/dkms"
