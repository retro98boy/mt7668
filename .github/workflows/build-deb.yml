name: Build DKMS package

on:
  push:
    branches: ['**']
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential debhelper dkms dh-dkms linux-headers-amd64 kmod

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Package the PR source commit instead of GitHub's temporary merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Trust mounted workspace
        # checkout uses a temporary global Git config; shell steps need their own entry.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(bash scripts/version.sh)
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            printf 'Tag must match the source version: %s\n' "$version" >&2
            exit 1
          fi

      - name: Build Debian package
        id: package
        shell: bash
        run: |
          bash scripts/build-deb.sh
          version=$(dpkg-deb -f dist/*.deb Version)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Verify DKMS install and removal
        shell: bash
        run: |
          version=${{ steps.package.outputs.version }}
          kernel=$(basename "$(find /lib/modules -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)")
          test -e "/lib/modules/$kernel/build/Makefile"
          mkdir -p /etc/dkms/framework.conf.d
          printf 'parallel_jobs=2\n' > /etc/dkms/framework.conf.d/mt7668-ci.conf
          apt-get install -y ./dist/*.deb
          dkms autoinstall -k "$kernel"
          dkms status -m mt7668 -v "$version" -k "$kernel" | grep ': installed$'
          for module in wlan_mt76x8_sdio bt_mt7668; do
            test "$(modinfo -k "$kernel" -F name "$module")" = "$module"
            test "$(modinfo -k "$kernel" -F vermagic "$module" | cut -d ' ' -f 1)" = "$kernel"
          done
          apt-get purge -y mt7668-dkms
          test -z "$(dkms status -m mt7668 -v "$version")"
          test ! -e "/usr/src/mt7668-$version"
          for module in wlan_mt76x8_sdio bt_mt7668; do
            if modinfo -k "$kernel" "$module" >/dev/null 2>&1; then
              printf 'Module remains after package removal: %s\n' "$module" >&2
              exit 1
            fi
          done

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mt7668-dkms-${{ steps.package.outputs.version }}
          path: dist/
          if-no-files-found: error

  install-compatibility:
    name: Install on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:bullseye-slim
          - debian:bookworm-slim
          - debian:trixie-slim
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check out installation test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download the shared package
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "mt7668-dkms-$RELEASE_VERSION" --dir dist
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Verify package compatibility
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            -v "$PWD/dist:/packages:ro" -v "$PWD/scripts:/tests:ro" \
            "$TEST_IMAGE" bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              . /etc/os-release
              if [ "$ID" = debian ] && [ "$VERSION_ID" = 11 ]; then
                printf "%s\n" \
                  "deb [check-valid-until=no] http://archive.debian.org/debian bullseye main" \
                  "deb [check-valid-until=no] http://archive.debian.org/debian-security bullseye-security main" \
                  > /etc/apt/sources.list
              fi
              apt-get update
              apt-get install -y --no-install-recommends dkms make gcc perl xz-utils
              bash /tests/test-deb-install.sh /packages/*.deb
            '

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, install-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download package
        run: |
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "mt7668-dkms-$RELEASE_VERSION" --dir dist

      - name: Create draft release for existing tag
        run: |
          test "$GITHUB_REF_NAME" = "$RELEASE_VERSION"
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" \
            "dist/mt7668-dkms_${RELEASE_VERSION}_all.deb" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --generate-notes
